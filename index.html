<style>
:root{
  --bg:#FAF7F2;
  --surface:#FFFFFF;
  --ink:#242420;
  --ink-soft:#5C594F;
  --ink-muted:#9A9484;
  --line:#E7E1D5;
  --line-soft:#F0ECE2;
  --teal:#1F4A48;
  --teal-dark:#153433;
  --teal-soft:#E3ECEA;
  --berry:#9C4F5E;
  --berry-soft:#F4E5E8;
  --sage:#6E7F5C;
  --sage-soft:#EAEEE1;
  --gold:#B8873F;
  --gold-soft:#F5EBDA;
  --danger:#B4453D;
  --radius-sm:10px;
  --radius-md:16px;
  --radius-lg:22px;
  --shadow-card:0 1px 2px rgba(36,36,32,0.05), 0 2px 16px rgba(36,36,32,0.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;touch-action:manipulation;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Inter',-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));
  padding-left:env(safe-area-inset-left);
  padding-right:env(safe-area-inset-right);
}
h1,h2,h3,.serif{ font-family:'Fraunces',serif; letter-spacing:-0.01em; }
button, input, select, textarea{ font-family:inherit; }
::selection{ background:var(--teal-soft); }

#appShell{ max-width:640px; margin:0 auto; padding:0 20px 8px; }
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:calc(18px + env(safe-area-inset-top)) 20px 14px; max-width:640px; margin:0 auto;
}
.brand{ display:flex; align-items:center; gap:10px; }
.brand-mark{
  width:30px; height:30px; border-radius:50%;
  border:1.5px solid var(--teal); position:relative; flex-shrink:0;
}
.brand-mark::before{
  content:"$"; position:absolute; left:50%; top:50%;
  transform:translate(-50%,-52%); font-family:'Fraunces',serif; font-size:15px; font-weight:600; color:var(--teal);
}
.brand-name{ font-size:17px; font-weight:600; font-family:'Fraunces',serif; }
.brand-sub{ font-size:11px; color:var(--ink-muted); margin-top:-2px; letter-spacing:.02em; }
.iconbtn{
  width:38px; height:38px; border-radius:50%; border:1px solid var(--line);
  background:var(--surface); display:flex; align-items:center; justify-content:center;
  cursor:pointer; color:var(--ink-soft); font-size:16px;
}
.iconbtn:active{ transform:scale(0.94); }

.lanes{ display:flex; flex-direction:column; gap:3px; margin:22px 0 18px; }
.lanes span{ display:block; height:1px; background:var(--line); }
.lanes span:nth-child(2){ margin-left:14px; margin-right:14px; opacity:.6; }

.section-label{
  font-size:11.5px; text-transform:uppercase; letter-spacing:.09em;
  color:var(--ink-muted); font-weight:600; margin:0 0 10px 2px;
}

.card{
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--radius-lg); padding:18px; box-shadow:var(--shadow-card);
  margin-bottom:14px;
}
.card-tight{ padding:14px 16px; }

.tabbar{
  position:fixed; bottom:0; left:0; right:0;
  background:rgba(250,247,242,0.92); backdrop-filter:blur(10px);
  border-top:1px solid var(--line);
  display:flex; justify-content:space-around;
  padding:8px 4px calc(10px + env(safe-area-inset-bottom));
  padding-left:calc(4px + env(safe-area-inset-left));
  padding-right:calc(4px + env(safe-area-inset-right));
  z-index:50;
}
.tab{
  display:flex; flex-direction:column; align-items:center; gap:3px;
  border:none; background:none; color:var(--ink-muted);
  font-size:10.5px; font-weight:500; padding:4px 6px; cursor:pointer;
  flex:1; max-width:78px;
}
.tab .dot{ width:6px; height:6px; border-radius:50%; background:transparent; margin-bottom:1px; }
.tab.active{ color:var(--teal); }
.tab.active .dot{ background:var(--teal); }
.tab-ic{ font-size:19px; line-height:1; }

label{ display:block; font-size:12.5px; color:var(--ink-soft); margin-bottom:5px; font-weight:500; }
input, select, textarea{
  width:100%; min-width:0; box-sizing:border-box; border:1px solid #DDD4C2; border-radius:var(--radius-sm);
  padding:11px 12px; font-size:14.5px; color:var(--ink); background:#F3EEE2;
  outline:none; transition:border-color .15s, background .15s;
}
input:focus, select:focus, textarea:focus{ border-color:var(--teal); background:var(--surface); }
.field{ margin-bottom:13px; }
.row2{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px; min-width:0; }
.row3{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr); gap:10px; min-width:0; }
.row2 > *, .row3 > *{ min-width:0; }

.btn{
  border:1px solid var(--line); background:var(--surface); color:var(--ink);
  border-radius:999px; padding:11px 18px; font-size:14px; font-weight:600;
  cursor:pointer; display:inline-flex; align-items:center; gap:6px; justify-content:center;
}
.btn:active{ transform:scale(0.97); }
.btn-primary{ background:var(--teal); border-color:var(--teal); color:#fff; }
.btn-block{ width:100%; }
.btn-ghost{ background:transparent; border-color:transparent; color:var(--ink-soft); padding:8px 10px; }
.btn-sm{ padding:7px 13px; font-size:12.5px; }
.btn-danger-outline{ color:var(--danger); border-color:#ECD3D0; }

.chip{
  display:inline-flex; align-items:center; gap:5px; padding:5px 11px;
  border-radius:999px; font-size:12px; font-weight:600; border:1px solid transparent;
}
.chip-teal{ background:var(--teal-soft); color:var(--teal-dark); }
.chip-berry{ background:var(--berry-soft); color:var(--berry); }
.chip-sage{ background:var(--sage-soft); color:var(--sage); }
.chip-gold{ background:var(--gold-soft); color:var(--gold); }
.chip-outline{ background:transparent; border-color:var(--line); color:var(--ink-soft); cursor:pointer; }
.chip-outline.on{ background:var(--ink); border-color:var(--ink); color:#fff; }

.empty{
  text-align:center; padding:34px 18px; color:var(--ink-muted); font-size:13.5px;
}
.empty .serif{ font-size:16px; color:var(--ink-soft); display:block; margin-bottom:4px; }

.hidden{ display:none !important; }
::-webkit-scrollbar{ width:0; height:0; }
</style>
</head>

<script>
/* ============ Firebase (misma cuenta que Bitácora, datos separados) ============ */
const firebaseConfig = {
  apiKey: "AIzaSyDp-c-LrlT_d5iIy3HqfaDCw6J0vqzLxgE",
  authDomain: "bitacora-d878c.firebaseapp.com",
  projectId: "bitacora-d878c",
  storageBucket: "bitacora-d878c.firebasestorage.app",
  messagingSenderId: "167285782519",
  appId: "1:167285782519:web:f149e39970da9b69ec20f2"
};
let fbApp=null, fbAuth=null, fbDb=null, currentUser=null;
try{
  fbApp = firebase.initializeApp(firebaseConfig, 'finanzas');
  fbAuth = fbApp.auth();
  fbDb = fbApp.firestore();
}catch(e){ console.error('Firebase init', e); }

async function signUpEmail(){
  const email = document.getElementById('auth_email').value.trim();
  const pass = document.getElementById('auth_pass').value;
  if(!email || pass.length<6){ toast('Escribe un correo y una contraseña de mínimo 6 caracteres'); return; }
  try{
    const result = await fbAuth.createUserWithEmailAndPassword(email, pass);
    toast('Cuenta creada: ' + result.user.email);
  }catch(e){
    console.error('signUp error', e);
    const msgs = { 'auth/email-already-in-use':'Ese correo ya tiene una cuenta, usa "Ya tengo cuenta"', 'auth/invalid-email':'Correo inválido', 'auth/weak-password':'Contraseña muy débil' };
    toast(msgs[e.code] || ('Error: ' + (e.code||e.message)));
  }
}
async function signInEmail(){
  const email = document.getElementById('auth_email').value.trim();
  const pass = document.getElementById('auth_pass').value;
  if(!email || !pass){ toast('Escribe tu correo y tu contraseña'); return; }
  try{
    const result = await fbAuth.signInWithEmailAndPassword(email, pass);
    toast('Sesión iniciada: ' + result.user.email);
  }catch(e){
    console.error('signIn error', e);
    const msgs = { 'auth/invalid-credential':'Correo o contraseña incorrectos', 'auth/user-not-found':'No existe una cuenta con ese correo, usa "Crear cuenta"', 'auth/wrong-password':'Contraseña incorrecta' };
    toast(msgs[e.code] || ('Error: ' + (e.code||e.message)));
  }
}
function signOutAccount(){ if(fbAuth) fbAuth.signOut(); }
async function migrateToCloud(){
  if(!currentUser){ toast('Inicia sesión primero'); return; }
  toast('Subiendo tus datos a la nube…');
  try{
    await dbSet('config', App.data.config);
    await dbSet('extras', App.data.extras);
    await dbSet('accounts', App.data.accounts);
    await dbSet('pockets', App.data.pockets);
    await dbSet('movements', App.data.movements);
    await dbSet('debts', App.data.debts);
    await dbSet('wishlist', App.data.wishlist);
    toast('¡Listo! Tus datos ya están en la nube');
  }catch(e){
    console.error('migración', e);
    toast('Hubo un problema subiendo los datos');
  }
}
if(fbAuth){
  fbAuth.onAuthStateChanged(async (user)=>{
    const changed = (user && !currentUser) || (!user && currentUser);
    currentUser = user;
    if(changed && window.APP_BOOTED){
      await loadAll();
      render();
    }
  });
}

/* ============ almacenamiento ============ */
function hasCloudStorage(){
  return typeof window!=='undefined' && window.storage && typeof window.storage.get==='function';
}
function localGet(key){ try{ return localStorage.getItem('finanzas_'+key); }catch(e){ return null; } }
function localSet(key, value){ try{ localStorage.setItem('finanzas_'+key, value); }catch(e){ console.error('localStorage lleno o no disponible', e); } }
function localDelete(key){ try{ localStorage.removeItem('finanzas_'+key); }catch(e){} }

async function dbGet(key, fallback){
  try{
    if(currentUser){
      const snap = await fbDb.collection('users').doc(currentUser.uid).collection('finanzas').doc(key).get();
      return snap.exists ? JSON.parse(snap.data().value) : fallback;
    }
    if(hasCloudStorage()){ const r = await window.storage.get(key, false); return r ? JSON.parse(r.value) : fallback; }
    const v = localGet(key);
    return v!=null ? JSON.parse(v) : fallback;
  }catch(e){ console.error('storage get', key, e); return fallback; }
}
async function dbSet(key, value){
  try{
    const json = JSON.stringify(value);
    if(currentUser){ await fbDb.collection('users').doc(currentUser.uid).collection('finanzas').doc(key).set({value:json}); return; }
    if(hasCloudStorage()) await window.storage.set(key, json, false);
    else localSet(key, json);
  }catch(e){ console.error('storage set', key, e); }
}
async function dbDelete(key){
  try{
    if(currentUser){ await fbDb.collection('users').doc(currentUser.uid).collection('finanzas').doc(key).delete(); return; }
    if(hasCloudStorage()) await window.storage.delete(key, false);
    else localDelete(key);
  }catch(e){}
}

/* ============ utilidades ============ */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayISO(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function currentMonthKey(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }
function monthKeyOf(iso){ return iso.slice(0,7); }
const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function humanDate(iso){ const d=new Date(iso+'T00:00:00'); return d.getDate()+' '+MONTHS[d.getMonth()].slice(0,3); }
function humanMonth(mk){ const [y,m]=mk.split('-').map(Number); return MONTHS[m-1]+' '+y; }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(n){ n = Math.round(+n||0); return '$' + n.toLocaleString('es-CO'); }
function toast(msg){
  let t = document.getElementById('toastEl');
  if(!t){ t=document.createElement('div'); t.id='toastEl';
    t.style.cssText='position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none;';
    document.body.appendChild(t);
  }
  t.textContent = msg; t.style.opacity='1';
  clearTimeout(t._h); t._h=setTimeout(()=>{ t.style.opacity='0'; }, 1600);
}

    bank:'<path d="M3 8l7-4.3 7 4.3"/><path d="M4 8.3V15h12V8.3"/><path d="M8 11.5v3M12 11.5v3"/><path d="M3 15h14"/>',
    debt:'<path d="M4 7h9M10.5 4l3 3-3 3"/><path d="M16 13H7M9.5 10l-3 3 3 3"/>',

/* ============ cálculos compartidos ============ */
function pocketsTotal(){ return (App.data.pockets||[]).reduce((s,p)=>s+(+p.balance||0),0); }
function accountsTotal(){
  const a = App.data.accounts||{};
  return (+a.bancoBogota||0) + (+a.nequi||0) + (+a.efectivo||0) + pocketsTotal();
}
function monthlyIncome(mk){
  mk = mk || currentMonthKey();
  const base = +((App.data.config||{}).salary)||0;
  const extras = (App.data.extras||[]).filter(e=>monthKeyOf(e.date)===mk).reduce((s,e)=>s+(+e.amount||0),0);
  return base + extras;
}
function monthSpentByCategory(mk){
  mk = mk || currentMonthKey();
  const out = {necesidades:0, deseos:0, ahorro:0};
  (App.data.movements||[]).forEach(m=>{
    if(m.type==='gasto' && monthKeyOf(m.date)===mk && out.hasOwnProperty(m.category)) out[m.category]+=(+m.amount||0);
  });
  return out;
}
function debtsRemainingTotal(){
  return (App.data.debts||[]).reduce((s,d)=>{
    const paid = (d.payments||[]).reduce((a,p)=>a+(+p.amount||0),0);
    return s + Math.max(0, (+d.totalAmount||0) - paid);
  },0);
}

function budgetRow(label, pct, spent, income, color){

  return `<div style="margin-bottom:14px;">
    <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;">
      <span>${label} <span style="color:var(--ink-muted);">(${pct}%)</span></span>
      <span style="color:${over?'var(--danger)':'var(--ink-soft)'};">${fmt(spent)} / ${fmt(target)}</span>
    </div>
    <div style="height:8px;border-radius:999px;background:var(--line-soft);overflow:hidden;">
      <div style="height:100%;width:${Math.round(ratio*100)}%;background:${over?'var(--danger)':`var(--${color})`};border-radius:999px;"></div>
    </div>
  </div>`;
}
function quickRow(ic,label,tab){
  return `<button onclick="Nav.go('${tab}')" style="display:flex;align-items:center;gap:12px;width:100%;background:none;border:none;padding:12px 8px;border-bottom:1px solid var(--line-soft);cursor:pointer;text-align:left;color:var(--ink);font-size:13.5px;">

}

/* ============ ajuste de saldos ============ */
function accountLabel(acc){
  if(!acc) return '';
  if(acc.startsWith('bolsillo:')){
    const p = (App.data.pockets||[]).find(p=>p.id===acc.slice(9));
    return p ? `Bolsillo: ${p.name}` : 'Bolsillo';
  }
  const labels = {bancoBogota:'Banco de Bogotá', nequi:'Nequi', efectivo:'Efectivo'};
  return labels[acc] || acc;
}
function adjustAccountBalance(acc, delta){
  if(!acc || !delta) return;
  if(acc.startsWith('bolsillo:')){
    const p = (App.data.pockets||[]).find(p=>p.id===acc.slice(9));
    if(p) p.balance = round2((+p.balance||0)+delta);
  } else {
    App.data.accounts[acc] = round2((+App.data.accounts[acc]||0)+delta);
  }
}
function round2(n){ return Math.round(n*100)/100; }
function saveAccountsAndPockets(){
  dbSet('accounts', App.data.accounts);
  dbSet('pockets', App.data.pockets);
}
function accountOptionsHtml(selected){
  let html = `<option value="bancoBogota" ${selected==='bancoBogota'?'selected':''}>Banco de Bogotá</option>`;
  html += `<option value="nequi" ${selected==='nequi'?'selected':''}>Nequi</option>`;
  html += `<option value="efectivo" ${selected==='efectivo'?'selected':''}>Efectivo</option>`;
  (App.data.pockets||[]).forEach(p=>{
    const v = 'bolsillo:'+p.id;
    html += `<option value="${v}" ${selected===v?'selected':''}>Bolsillo: ${esc(p.name)}</option>`;
  });
  return html;
}

    </div>
    <div class="row2">
      <div class="field"><label>Fecha</label><input id="mv_date" type="date" value="${editing?editing.date:todayISO()}"></div>
      <div class="field"><label>Monto</label><input id="mv_amount" type="number" step="1" value="${editing?editing.amount:''}" placeholder="$"></div>
    </div>
    <div class="row2">
      <div class="field"><label>Cuenta</label><select id="mv_account">${accountOptionsHtml(editing?editing.account:'efectivo')}</select></div>
      <div class="field"><label>Categoría</label><select id="mv_category">${cats.map(c=>`<option value="${c.k}" ${editing&&editing.category===c.k?'selected':''}>${c.label}</option>`).join('')}</select></div>
    </div>
    <div class="field"><label>Descripción</label><input id="mv_desc" value="${editing?esc(editing.description):''}" placeholder="Ej: chicle, mercado, uber…"></div>
    <div style="display:flex;gap:8px;">
      <button class="btn btn-primary" style="flex:1;" onclick="saveMovement()">${icon('check')} ${editing?'Guardar cambios':'Registrar'}</button>
      <button class="btn" style="flex:1;" onclick="cancelMovForm()">Cancelar</button>
    </div>
  </div>`;
}
function cancelMovForm(){ App.ui.movForm=false; App.ui.editingMovId=null; render(); }
function startEditMovement(id){
  App.ui.editingMovId = id;
  App.ui.movForm = true;
  render();
}
function saveMovement(){
  const date = document.getElementById('mv_date').value || todayISO();
  const amount = +document.getElementById('mv_amount').value;
  const account = document.getElementById('mv_account').value;
  const category = document.getElementById('mv_category').value;
  const description = document.getElementById('mv_desc').value.trim();
  if(!amount || amount<=0){ toast('Escribe un monto válido'); return; }
  App.data.movements = App.data.movements||[];
  if(App.ui.editingMovId){
    const m = App.data.movements.find(m=>m.id===App.ui.editingMovId);
    const oldDelta = m.type==='ingreso' ? m.amount : -m.amount;
    adjustAccountBalance(m.account, -oldDelta);
    m.date=date; m.amount=amount; m.account=account; m.category=category; m.description=description;
    const newDelta = m.type==='ingreso' ? amount : -amount;
    adjustAccountBalance(account, newDelta);
  } else {
    const type = App.ui.movType;
    const record = {id:uid(), type, date, amount, account, category, description};
    App.data.movements.push(record);
    adjustAccountBalance(account, type==='ingreso'?amount:-amount);
  }
  App.ui.movForm = false;
  App.ui.editingMovId = null;
  toast('Movimiento guardado');
  render();
  dbSet('movements', App.data.movements);
  saveAccountsAndPockets();
}
function deleteMovement(id){
  const m = (App.data.movements||[]).find(m=>m.id===id);
  if(!m) return;
  const delta = m.type==='ingreso' ? m.amount : -m.amount;
  adjustAccountBalance(m.account, -delta);
  App.data.movements = App.data.movements.filter(x=>x.id!==id);
  render();
  dbSet('movements', App.data.movements);
  saveAccountsAndPockets();
}

  const showForm = App.ui.payDebtId===d.id;
  return `<div class="card" style="margin-bottom:12px;">

    </div>

      <span style="font-size:20px;font-weight:600;font-family:'Fraunces',serif;color:${done?'var(--sage)':'var(--berry)'};">${done?'Pagada':fmt(remaining)}</span>
      ${!done?`<span style="font-size:11.5px;color:var(--ink-muted);">pendiente</span>`:''}
    </div>
    <div style="height:8px;border-radius:999px;background:var(--line-soft);overflow:hidden;margin-bottom:12px;">
      <div style="height:100%;width:${d.totalAmount>0?Math.round(100*paid/d.totalAmount):0}%;background:var(--sage);border-radius:999px;"></div>
    </div>
    ${!done ? (showForm ? `
      <div class="row2">
        <div class="field"><label>Fecha</label><input id="dt_p_date_${d.id}" type="date" value="${todayISO()}"></div>
        <div class="field"><label>Monto del abono</label><input id="dt_p_amount_${d.id}" type="number" placeholder="$"></div>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-primary" style="flex:1;" onclick="addDebtPayment('${d.id}')">${icon('check')} Registrar abono</button>
        <button class="btn" style="flex:1;" onclick="App.ui.payDebtId=null;render();">Cancelar</button>
      </div>
    ` : `<button class="btn btn-sm" onclick="App.ui.payDebtId='${d.id}';render();">${icon('plus')} Abonar</button>`) : ''}
    ${payments.length ? `
      <div style="margin-top:12px;">
        ${payments.map(p=>`
          <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);padding:5px 0;border-top:1px solid var(--line-soft);">
            <span>${humanDate(p.date)}</span><span>${fmt(p.amount)}</span>
          </div>`).join('')}
      </div>
    ` : ''}
  </div>`;
}

          <button class="iconbtn" style="width:22px;height:22px;${i===pending.length-1?'opacity:.3;':''}" onclick="moveWish('${w.id}',1)" aria-label="Bajar prioridad">${icon('down')}</button>

        <button class="iconbtn" style="width:26px;height:26px;" onclick="deleteWish('${w.id}')" aria-label="Eliminar">${icon('trash')}</button>
      </div>`).join('')}

        <button class="iconbtn" style="width:26px;height:26px;" onclick="deleteWish('${w.id}')" aria-label="Eliminar">${icon('trash')}</button>
      </div>`).join('')}

function addWish(){
  const name = document.getElementById('w_name').value.trim();
  const price = +document.getElementById('w_price').value || 0;
  if(!name){ toast('Escribe qué quieres comprar'); return; }
  App.data.wishlist = App.data.wishlist || [];
  const maxOrder = App.data.wishlist.reduce((m,w)=>Math.max(m,w.order||0),0);
  App.data.wishlist.push({id:uid(), name, price, order:maxOrder+1, purchased:false, purchaseDate:null});
  App.ui.wishForm = false;
  toast('Agregado a tu lista');
  render();
  dbSet('wishlist', App.data.wishlist);
}
function deleteWish(id){
  App.data.wishlist = (App.data.wishlist||[]).filter(w=>w.id!==id);
  render();
  dbSet('wishlist', App.data.wishlist);
}
function moveWish(id, dir){
  const pending = (App.data.wishlist||[]).filter(w=>!w.purchased).sort((a,b)=>a.order-b.order);
  const idx = pending.findIndex(w=>w.id===id);
  const swapIdx = idx+dir;
  if(swapIdx<0 || swapIdx>=pending.length) return;
  const a = pending[idx], b = pending[swapIdx];
  const tmp = a.order; a.order = b.order; b.order = tmp;
  render();
  dbSet('wishlist', App.data.wishlist);
}
function markPurchased(id){
  const w = App.data.wishlist.find(w=>w.id===id);
  if(w){ w.purchased = true; w.purchaseDate = todayISO(); }
  toast('Marcado como comprado');
  render();
  dbSet('wishlist', App.data.wishlist);
}

/* ============ boot ============ */
(async function boot(){
  await loadAll();
  renderTabbar();
  render();
  window.APP_BOOTED = true;
})();
</script>
